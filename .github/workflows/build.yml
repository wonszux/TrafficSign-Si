name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore TrafficSign-Si.slnx -p:Platform=x64 --locked-mode
      - name: Build Release
        run: dotnet build TrafficSign-Si.slnx -c Release -p:Platform=x64 -p:UseSharedCompilation=false --no-restore
      - name: Run tests
        run: dotnet test TrafficSign.Tests/TrafficSign.Tests.csproj -c Release --no-build --no-restore
